name: CloudHub 2.0 Pipeline
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: SANDBOX
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cache Folder
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*-SNAPSHOT
            !~/.m2/repository/.cache
            !~/.m2/repository/.meta
          key: ${{ runner.os }}-maven-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-v2-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          ${{ secrets.MAVEN_SETTINGS_XML }}
          EOF

      - name: Build and publish to Exchange
        run: |
          mvn clean deploy -DskipTests \
            -Dcaclientid=${{ secrets.CONNECTED_APP_CLIENT_ID }} \
            -Dcaclientsecret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }} \
            -Dapenv=${{ vars.AP_ENV }} \
            -Dmule.env=${{ vars.MULE_ENV }} \
            -Dtargetname=${{ vars.TARGET }} \
            -Dreplica=${{ vars.REPLICA }} \
            -Dcore=${{ vars.CORE }} \
            --settings ~/.m2/settings.xml

      - name: Upload Mule Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: mule-app-jar
          path: target/*.jar
          retention-days: 1

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: SANDBOX
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Mule Application JAR
        uses: actions/download-artifact@v4
        with:
          name: mule-app-jar
          path: target/

      - name: Verify JAR
        run: |
          echo "Contents of target directory:"
          ls -lh target/
          echo "JAR_FILE=$(ls target/*.jar)" >> $GITHUB_ENV

      - name: Set up Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          ${{ secrets.MAVEN_SETTINGS_XML }}
          EOF

      - name: Deploy to CloudHub 2.0
        run: |
          mvn -DskipTests mule:deploy \
            -Danypoint.platform.gatekeeper=disabled \
            -Dcaclientid=${{ secrets.CONNECTED_APP_CLIENT_ID }} \
            -Dcaclientsecret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }} \
            -Dapenv=${{ vars.AP_ENV }} \
            -Dmule.env=${{ vars.MULE_ENV }} \
            -Dtargetname=${{ vars.TARGET }} \
            -Dreplica=${{ vars.REPLICA }} \
            -Dcore=${{ vars.CORE }} \
            -Dmule.artifact=${{ env.JAR_FILE }} \
            --settings ~/.m2/settings.xml
