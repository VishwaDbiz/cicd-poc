name: CloudHub 2.0 Pipeline

on:
  push:
    branches:
      -  dev
  pull_request:
    branches:
      -  dev
  workflow_dispatch:

jobs:
    build:
     if: github.ref == 'refs/heads/develop'
     runs-on: ubuntu-latest
     environment: SANDBOX
     steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Cache Folder
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/**/*-SNAPSHOT
            !~/.m2/repository/.cache
            !~/.m2/repository/.meta
          key: ${{ runner.os }}-maven-v2-${{ hashFiles('**/pom.xml') }}  # ← v2 forces new cache
          restore-keys: |
            ${{ runner.os }}-maven-v2-
          retention-days: 7
     

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Maven settings.xml
        run: |
            mkdir -p ~/.m2
            echo "${{ secrets.MAVEN_SETTINGS_XML }}" > ~/.m2/settings.xml
           
      - name: Build Mule App
        run: |
            mvn clean package -DskipTests --settings ~/.m2/settings.xml
           
      - name: Publish to Exchange (required for CH2)
        run: |
            mvn -DskipTests clean deploy  \
              -Dclient.id=${{ secrets.CONNECTED_APP_CLIENT_ID }} \
              -Dclient.secret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }} \
              --settings ~/.m2/settings.xml
             
       # NEW: Upload the built JAR
      - name: Upload Mule Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: mule-app-jar
          path: target/*.jar
          retention-days: 1        

    deploy-dev:
      needs: build
      if: github.ref == 'refs/heads/develop'  
      runs-on: ubuntu-latest
      environment: SANDBOX
      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

         # NEW: Download the built JAR
        - name: Download Mule Application JAR
          uses: actions/download-artifact@v4
          with:
            name: mule-app-jar
            path: target/
     
         # Verify the JAR is present
        - name: Verify JAR
          run: |
            echo "Contents of target directory:"
            ls -lh target/
            JAR_FILE=$(ls target/*.jar)
            echo "Found JAR: $JAR_FILE"
 
        - name: Set up Maven settings.xml
          run: |
            mkdir -p ~/.m2
            echo "${{ secrets.MAVEN_SETTINGS_XML }}" > ~/.m2/settings.xml
 
        - name: Deploy to CloudHub 2.0
          run: |
              mvn -DskipTests mule:deploy \
                -anypoint.platform.gatekeeper=disabled \
                -Dcaclientid=${{ secrets.CONNECTED_APP_CLIENT_ID }} \
                -Dcaclientsecret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }} \
                -Dapenv=${{ vars.AP_ENV }} \
                -Dmule.env=${{ vars.MULE_ENV }} \
                -Dtargetname=${{ vars.TARGET }} \
                -DapiId=${{ vars.API_ID }}\
                -Dapclientid=${{ secrets.AP_CLIENT_ID }} \
                -Dapclientsecret=${{ secrets.AP_CLIENT_SECRET }} \
                -Dreplica=${{ vars.REPLICA }} \
                -Dcore=${{ vars.CORE }} \
                -Dmule.artifact=$JAR_FILE \
                --settings ~/.m2/settings.xml
